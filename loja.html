<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17251f">
  <title>Cardapio | ZapMesa</title>
  <style>
    :root { --ink: #17251f; --muted: #68756e; --paper: #f5f4ee; --accent: #e9b949; --green: #1f694b; --line: #dfe3da; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; color: var(--ink); background: var(--paper); font-family: Georgia, 'Times New Roman', serif; }
    .store-shell { max-width: 1120px; margin: 0 auto; padding: 28px 22px 70px; }
    .store-header { min-height: 250px; padding: 34px clamp(22px, 6vw, 70px); display: flex; align-items: flex-end; justify-content: space-between; gap: 28px; color: #fff; background: var(--ink); overflow: hidden; position: relative; }
    .store-header::after { width: 230px; height: 230px; content: ''; position: absolute; right: -55px; top: -80px; border: 1px solid rgba(233,185,73,.6); border-radius: 50%; box-shadow: 0 0 0 24px rgba(233,185,73,.08), 0 0 0 48px rgba(233,185,73,.05); }
    .kicker { margin: 0 0 15px; color: var(--accent); font: 700 11px Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 650px; margin: 0; font-size: clamp(40px, 7vw, 76px); line-height: .92; font-weight: 400; letter-spacing: -.04em; }
    .header-note { max-width: 180px; margin: 0; color: #d2dbd3; font: 13px/1.5 Arial, sans-serif; position: relative; z-index: 1; }
    .store-toolbar { padding: 28px 0 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--line); }
    .store-toolbar h2 { margin: 0; font-size: 26px; font-weight: 400; }
    .store-count { color: var(--muted); font: 12px Arial, sans-serif; }
    .products { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; padding-top: 24px; }
    .product { display: flex; flex-direction: column; min-height: 330px; background: #fff; border: 1px solid var(--line); }
    .product-image { width: 100%; height: 170px; display: block; object-fit: cover; background: #e8ebe4; }
    .product-body { padding: 19px; display: flex; flex: 1; flex-direction: column; }
    .product-category { margin: 0 0 8px; color: var(--green); font: 700 10px Arial, sans-serif; letter-spacing: .13em; text-transform: uppercase; }
    .product h3 { margin: 0; font-size: 23px; line-height: 1.05; font-weight: 400; }
    .product-description { margin: 10px 0 18px; color: var(--muted); font: 13px/1.5 Arial, sans-serif; }
    .product-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; }
    .price { color: var(--green); font: 700 17px Arial, sans-serif; }
    .order-link { padding: 10px 12px; color: var(--ink); background: var(--accent); font: 700 11px Arial, sans-serif; text-decoration: none; }
    .state { padding: 70px 20px; color: var(--muted); text-align: center; font: 14px Arial, sans-serif; }
    .state strong { display: block; margin-bottom: 8px; color: var(--ink); font: 24px Georgia, serif; }
    footer { padding-top: 46px; color: var(--muted); text-align: center; font: 11px Arial, sans-serif; }
    @media (max-width: 760px) { .store-shell { padding: 12px 14px 48px; } .store-header { min-height: 300px; flex-direction: column; align-items: flex-start; justify-content: flex-end; } .header-note { max-width: 245px; } .products { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 480px) { .products { grid-template-columns: 1fr; } .product { min-height: 0; } .product-image { height: 210px; } }
  </style>
</head>
<body>
  <main class="store-shell">
    <header class="store-header">
      <div><p class="kicker">Cardapio online</p><h1 id="store-name">Seu restaurante</h1></div>
      <p class="header-note">Escolha seus favoritos e fale com a nossa equipe pelo WhatsApp.</p>
    </header>
    <div class="store-toolbar"><h2>O que vai ser hoje?</h2><span class="store-count" id="store-count"></span></div>
    <section class="products" id="products" aria-live="polite"><div class="state"><strong>Carregando cardapio</strong>Um instante.</div></section>
    <footer>Cardapio digital powered by ZapMesa</footer>
  </main>
  <script>
    const query = new URLSearchParams(window.location.search);
    const restaurantId = query.get('restaurant');
    const productsElement = document.querySelector('#products');
    const storeNameElement = document.querySelector('#store-name');
    const countElement = document.querySelector('#store-count');
    const fallbackImage = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=900&q=80';

    function money(value) { return Number(value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char])); }

    async function loadStore() {
      if (!restaurantId) {
        productsElement.innerHTML = '<div class="state"><strong>Loja indisponivel</strong>Este link nao informou o restaurante.</div>';
        return;
      }
      try {
        const response = await fetch(`/api/store?restaurant=${encodeURIComponent(restaurantId)}`);
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error);
        storeNameElement.textContent = result.restaurantName || 'Seu restaurante';
        const products = result.products || [];
        countElement.textContent = `${products.length} ${products.length === 1 ? 'item' : 'itens'}`;
        if (!products.length) {
          productsElement.innerHTML = '<div class="state"><strong>Cardapio em preparo</strong>Em breve teremos novidades por aqui.</div>';
          return;
        }
        productsElement.innerHTML = products.map((product) => `
          <article class="product">
            <img class="product-image" src="${escapeHtml(product.image || fallbackImage)}" alt="${escapeHtml(product.name)}" loading="lazy">
            <div class="product-body">
              <p class="product-category">${escapeHtml(product.category || 'Especial')}</p>
              <h3>${escapeHtml(product.name || 'Produto')}</h3>
              ${product.description ? `<p class="product-description">${escapeHtml(product.description)}</p>` : ''}
              <div class="product-footer"><strong class="price">${money(product.price)}</strong><a class="order-link" href="https://wa.me/?text=${encodeURIComponent(`Ola! Quero pedir: ${product.name}`)}" target="_blank" rel="noreferrer">Pedir</a></div>
            </div>
          </article>`).join('');
      } catch {
        productsElement.innerHTML = '<div class="state"><strong>Nao foi possivel carregar</strong>Tente abrir este link novamente.</div>';
      }
    }
    loadStore();
  </script>
</body>
</html>
